# Example nginx site for Gayatri Convention (Hostinger VPS)
# Copy to /etc/nginx/sites-available/gayatriconvention.com and adjust paths/IP.

server {
    listen 80;
    listen [::]:80;
    server_name gayatriconvention.com www.gayatriconvention.com;

    # After certbot, HTTPS block is usually added automatically.
    # Do NOT enable AuthType Basic / htpasswd here.

    root /var/www/gayatri;
    index index.html;

    # SPA: public site + /staff login all served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Spring Boot on same VPS (port 8080)
    # Uncomment if the API runs locally and you did NOT set VITE_API_BASE.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
