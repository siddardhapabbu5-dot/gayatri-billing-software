# Example nginx site for Gayatri Convention (Hostinger VPS)
# Copy to /etc/nginx/sites-available/gayatriconvention.com and adjust paths/IP.

server {
    listen 80;
    listen [::]:80;
    server_name gayatriconvention.com www.gayatriconvention.com;

    # After certbot, HTTPS block is usually added automatically.
    # Do NOT enable AuthType Basic / htpasswd here.

    root /var/www/gayatri;
    index index.html;

    # SPA fallback: nested staff routes (/staff/calendar, /staff/rooms, …) and
    # the public site must serve index.html so React can resolve the path.
    # Without try_files, a direct refresh on /staff/calendar returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prefer this when the Spring Boot Docker image serves the built SPA (recommended):
    # location / {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 110M;
    # }
    # Spring SpaForwardController then serves index.html for /staff and /staff/**.

    # Optional: Spring Boot API only (static files still from root above)
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
