# Example / alternate: static dist/ behind nginx (try_files SPA fallback).
# Live Hostinger production site file is:
#   deploy/nginx-gayatri.conf  →  /etc/nginx/sites-available/gayatri
# (proxies all paths unchanged to 127.0.0.1:18080 — see deploy/HOSTINGER.md)

server {
    listen 80;
    listen [::]:80;
    server_name gayatriconvention.com www.gayatriconvention.com;

    # Do NOT enable AuthType Basic / htpasswd here.

    root /var/www/gayatri;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
