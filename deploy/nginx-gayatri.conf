# Production Nginx site for Gayatri Convention (Hostinger VPS)
#
# Install path on the VPS (exact replace):
#   /etc/nginx/sites-available/gayatri
#
# Upstream: Spring Boot + embedded SPA published on the host as 127.0.0.1:18080
# (Docker may map container :8080 → host :18080).
#
# Do NOT add location = /staff or location /staff/ that proxy_pass .../index.html
# — that rewrites the upstream URI and causes HTTPS 404 on /staff/calendar etc.
# SpaForwardController in the app already serves index.html for /staff and /staff/**.

# -----------------------------------------------------------------------------
# HTTP → ACME challenge + redirect to HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name gayatriconvention.com www.gayatriconvention.com app.gayatriconvention.com;

    # Let's Encrypt HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS — public site + staff desk + API (same origin)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gayatriconvention.com www.gayatriconvention.com;

    ssl_certificate     /etc/letsencrypt/live/gayatriconvention.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gayatriconvention.com/privkey.pem;
    # If your previous gayatri site had Certbot SSL includes, keep them from the .bak:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No AuthType Basic / htpasswd — staff auth is the SPA at /staff.

    # Proxy the request URI unchanged (including /staff, /staff/calendar, /api/...).
    # Trailing slash omitted on upstream so nginx does not strip or rewrite the path.
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 110M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# -----------------------------------------------------------------------------
# Legacy staff host → clean /staff on the main domain
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.gayatriconvention.com;

    ssl_certificate     /etc/letsencrypt/live/gayatriconvention.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gayatriconvention.com/privkey.pem;
    # If your previous gayatri site had Certbot SSL includes, keep them from the .bak:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://gayatriconvention.com/staff;
}
