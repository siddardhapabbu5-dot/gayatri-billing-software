spring:
  application:
    name: gayatri-vhms-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gayatri_vhms}
    username: ${SPRING_DATASOURCE_USERNAME:gayatri}
    password: ${SPRING_DATASOURCE_PASSWORD:gayatri123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:GayatriConventionHallJwtSecretKeyChangeInProduction_2026_MustBeLongEnough256Bits!!}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    # "*" required on Railway: same-origin module/CSS requests send Origin and were 403'd
    allowed-origins: ${APP_CORS_ORIGINS:*}

logging:
  level:
    org.springframework.security: INFO
    com.gayatri.vhms: INFO
