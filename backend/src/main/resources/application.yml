spring:
  application:
    name: gayatri-vhms-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/gayatri_vhms
    username: gayatri
    password: gayatri123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: GayatriConventionHallJwtSecretKeyChangeInProduction_2026_MustBeLongEnough256Bits!!
    expiration-ms: 86400000
  cors:
    allowed-origins: >-
      http://localhost:*,
      http://127.0.0.1:*,
      http://[::1]:*,
      http://192.168.*.*:*,
      http://10.*.*.*:*
  razorpay:
    enabled: false
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

logging:
  level:
    org.springframework.security: INFO
    com.gayatri.vhms: INFO
