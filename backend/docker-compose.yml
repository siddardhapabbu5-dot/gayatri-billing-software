services:
  db:
    image: postgres:16-alpine
    container_name: gayatri-postgres
    environment:
      POSTGRES_DB: gayatri_vhms
      POSTGRES_USER: gayatri
      POSTGRES_PASSWORD: gayatri123
    ports:
      - "5433:5432"
    volumes:
      - gayatri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gayatri -d gayatri_vhms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gayatri_pgdata:
